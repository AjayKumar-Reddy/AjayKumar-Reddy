<svg width="1140" height="250" viewBox="0 0 1140 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <pattern id="aboutDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.4" fill="#3b82f6" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Card background -->
  <rect width="1140" height="250" fill="url(#cardBg)" rx="12"/>
  <rect width="1140" height="250" fill="url(#aboutDots)" rx="12"/>
  <rect x="1" y="1" width="1138" height="248" fill="none" stroke="url(#cardBorder)" stroke-width="1.5" rx="11">
    <animate attributeName="stroke-opacity" values="0.4;0.7;0.4" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Code brackets icon -->
  <text x="570" y="45" font-family="'Courier New', 'Consolas', monospace" font-size="24" fill="#3b82f6" text-anchor="middle" font-weight="bold" opacity="0.9">&lt; / &gt;</text>

  <!-- Main tagline -->
  <text x="570" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#ffffff">Building. <tspan fill="#3b82f6">Learning.</tspan> Shipping.</text>

  <!-- Subtitle -->
  <text x="570" y="125" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle" letter-spacing="1">Open Source &amp; Coding Journey</text>

  <!-- Tech badges — Row 1 -->
  <!-- 5 badges × 100px + 4 gaps × 12px = 548px, start x = (1140-548)/2 = 296 -->

  <rect x="296" y="155" width="100" height="28" rx="6" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
  <text x="346" y="174" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="500">Java</text>

  <rect x="408" y="155" width="100" height="28" rx="6" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
  <text x="458" y="174" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="500">Python</text>

  <rect x="520" y="155" width="100" height="28" rx="6" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
  <text x="570" y="174" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="500">React</text>

  <rect x="632" y="155" width="100" height="28" rx="6" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
  <text x="682" y="174" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="500">Next.js</text>

  <rect x="744" y="155" width="100" height="28" rx="6" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
  <text x="794" y="174" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="500">Spring Boot</text>

  <!-- Tech badges — Row 2 -->
  <rect x="296" y="193" width="100" height="28" rx="6" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
  <text x="346" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="500">FastAPI</text>

  <rect x="408" y="193" width="100" height="28" rx="6" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
  <text x="458" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="500">AWS</text>

  <rect x="520" y="193" width="100" height="28" rx="6" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
  <text x="570" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="500">Docker</text>

  <rect x="632" y="193" width="100" height="28" rx="6" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
  <text x="682" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="500">Kafka</text>

  <rect x="744" y="193" width="100" height="28" rx="6" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
  <text x="794" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="500">Git</text>
</svg>
