      <circle cx="160" cy="18" r="4" fill="#38bdf8"/>
      <text x="172" y="23" font-family="'Segoe UI', sans-serif" font-size="14" fill="#f1f5f9" font-weight="700">FastAPI</text>

      <!-- Node / Express -->
