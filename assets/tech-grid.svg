      <circle cx="170" cy="18" r="4" fill="#60a5fa"/>
      <text x="182" y="23" font-family="'Segoe UI', sans-serif" font-size="14" fill="#f1f5f9" font-weight="700">RESTful APIs</text>

      <!-- System Design -->
      <rect x="296" y="0" width="132" height="36" rx="7" fill="#081426" stroke="#1a2e4c" stroke-width="1"/>
      <circle cx="312" cy="18" r="4" fill="#60a5fa"/>
      <text x="324" y="23" font-family="'Segoe UI', sans-serif" font-size="14" fill="#f1f5f9" font-weight="700">System Design</text>
    </g>

    <!-- Bottom Feature Bar -->
    <g transform="translate(20, 148)">
      <rect width="428" height="32" rx="6" fill="#060e1c" stroke="#162b47" stroke-width="0.8"/>
      <text x="214" y="20.5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
        ⚡ <tspan fill="#38bdf8" font-weight="600">Architectures:</tspan> Decoupled services, asynchronous queues &amp; robust APIs
      </text>
    </g>
  </g>

