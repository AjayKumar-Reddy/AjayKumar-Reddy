      <circle cx="16" cy="18" r="4" fill="#60a5fa"/>
      <text x="28" y="23" font-family="'Segoe UI', sans-serif" font-size="14" fill="#f1f5f9" font-weight="700">Microservices</text>

      <!-- RESTful APIs -->
