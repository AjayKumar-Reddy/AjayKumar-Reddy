<svg width="1000" height="490" viewBox="0 0 1000 490" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Steady Solid Underline Gradient -->
    <linearGradient id="techLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="techCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a33"/>
      <stop offset="100%" stop-color="#071020"/>
    </linearGradient>

    <pattern id="gridDot" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.5" fill="#3b82f6" opacity="0.08"/>
    </pattern>

    <filter id="techGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Section Title (Large 32px Font) -->
  <text x="500" y="34" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="2">
    <tspan fill="#60a5fa">TECHNICAL </tspan><tspan fill="#38bdf8">EXPERTISE &amp; TOOLKIT</tspan>
  </text>
  <rect x="330" y="46" width="340" height="2" fill="url(#techLineGrad)"/>

  <!-- ════════════ PANEL 1: BACKEND & DISTRIBUTED SYSTEMS (x:24, y:68) ════════════ -->
  <g transform="translate(24, 68)">
    <rect width="468" height="196" rx="12" fill="url(#techCardBg)"/>
    <rect width="468" height="196" rx="12" fill="url(#gridDot)"/>
    <rect x="1" y="1" width="466" height="194" rx="11" fill="none" stroke="#1d4ed8" stroke-width="1.2"/>

    <!-- Top Laser Runner (Real Motion) -->
    <line y1="1" y2="1" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#techGlow)">
      <animate attributeName="x1" values="-80;468" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;548" dur="3s" repeatCount="indefinite"/>
