<svg width="320" height="100" viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a33"/>
      <stop offset="100%" stop-color="#071020"/>
    </linearGradient>
    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="320" height="100" rx="12" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="318" height="98" rx="11" fill="none" stroke="#1d4ed8" stroke-width="1.2"/>

  <!-- Top Laser Runner (Real Motion) -->
  <line y1="1" y2="1" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#btnGlow)">
    <animate attributeName="x1" values="-60;320" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;380" dur="2.8s" repeatCount="indefinite"/>
  </line>

  <!-- Globe / Web Icon Circle -->
  <g transform="translate(32, 50)">
    <circle cx="0" cy="0" r="21" fill="#0f2847" stroke="#3b82f6" stroke-width="1.2"/>
    <!-- Globe wireframe icon -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#60a5fa" stroke-width="1.4"/>
    <ellipse cx="0" cy="0" rx="4.5" ry="10" fill="none" stroke="#60a5fa" stroke-width="1.4"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#60a5fa" stroke-width="1.4"/>
  </g>

  <!-- Text Area -->
  <text x="64" y="40" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12.5" fill="#38bdf8" font-weight="800" letter-spacing="1.5">
    LIVE PORTFOLIO
  </text>
  <text x="64" y="66" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14.5" fill="#ffffff" font-weight="700">
    fun-ai-portfolio.vercel.app
  </text>

  <!-- Right Status Indicator & Arrow -->
  <g transform="translate(290, 50)">
    <circle cx="-14" cy="0" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <!-- Arrow with horizontal bounce -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 4 0; 0 0" dur="1.5s" repeatCount="indefinite"/>
      <path d="M-2 -5 L3 0 L-2 5" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
