<svg width="1000" height="530" viewBox="0 0 1000 530" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Steady Solid Underline Gradient -->
    <linearGradient id="steadyProjLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="projCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a33"/>
      <stop offset="100%" stop-color="#071020"/>
    </linearGradient>

    <pattern id="projGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.5" fill="#60a5fa" opacity="0.08"/>
    </pattern>

    <filter id="projGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Header Title (Large 32px Font) -->
  <text x="500" y="34" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="2">
    <tspan fill="#60a5fa">FEATURED </tspan><tspan fill="#38bdf8">FLAGSHIP PROJECTS</tspan>
  </text>
  <rect x="340" y="46" width="320" height="2" fill="url(#steadyProjLine)"/>

  <!-- ═════════════════════ PROJECT 1: MSR INSIGHT (x:24, y:68) ═════════════════════ -->
  <g transform="translate(24, 68)">
    <!-- Card Container -->
    <rect width="468" height="442" rx="12" fill="url(#projCardBg)"/>
    <rect width="468" height="442" rx="12" fill="url(#projGrid)"/>

    <!-- Border -->
    <rect x="1" y="1" width="466" height="440" rx="11" fill="none" stroke="#1d4ed8" stroke-width="1.2"/>

    <!-- Top Laser Runner (Real Physical Beam) -->
    <line y1="1" y2="1" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#projGlow)">
      <animate attributeName="x1" values="-80;468" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;548" dur="3s" repeatCount="indefinite"/>
    </line>

    <!-- Number Pill & Title Area -->
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#0f2847" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="16" y="21.5" font-family="'Segoe UI', sans-serif" font-size="14" fill="#60a5fa" font-weight="800" text-anchor="middle">01</text>

      <text x="44" y="18" font-family="'Segoe UI', sans-serif" font-size="24" fill="#ffffff" font-weight="900" letter-spacing="0.5">MSR Insight</text>
      <text x="44" y="42" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8" font-weight="500">Analytics &amp; RAG-Powered AI Platform</text>

      <!-- Status Indicator Pill -->
      <rect x="306" y="2" width="122" height="24" rx="12" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="318" cy="14" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="328" y="17.5" font-family="'Segoe UI', sans-serif" font-size="11" fill="#34d399" font-weight="800" letter-spacing="0.5">RAG PIPELINE</text>
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="78" x2="448" y2="78" stroke="#1e3a5f" stroke-width="1"/>

    <!-- Tech Stack Pill Badges (Large 12px Font) -->
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="62" height="26" rx="5" fill="#0e2340" stroke="#1d4ed8" stroke-width="1"/>
      <text x="31" y="17.5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle" font-weight="700">Next.js</text>

      <rect x="68" y="0" width="62" height="26" rx="5" fill="#0e2340" stroke="#1d4ed8" stroke-width="1"/>
      <text x="99" y="17.5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle" font-weight="700">FastAPI</text>

      <rect x="136" y="0" width="68" height="26" rx="5" fill="#0e2340" stroke="#1d4ed8" stroke-width="1"/>
      <text x="170" y="17.5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle" font-weight="700">Express</text>

      <rect x="210" y="0" width="80" height="26" rx="5" fill="#0e2340" stroke="#1d4ed8" stroke-width="1"/>
      <text x="250" y="17.5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">LangChain</text>

      <rect x="296" y="0" width="76" height="26" rx="5" fill="#0e2340" stroke="#1d4ed8" stroke-width="1"/>
      <text x="334" y="17.5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle" font-weight="700">Postgres</text>

      <rect x="378" y="0" width="50" height="26" rx="5" fill="#0e2340" stroke="#1d4ed8" stroke-width="1"/>
      <text x="403" y="17.5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">Redis</text>
    </g>

    <!-- Key Architecture Highlights (Large 15px & 13.5px Fonts) -->
    <g transform="translate(20, 134)">
      <!-- Bullet 1 -->
      <circle cx="6" cy="10" r="3.5" fill="#38bdf8"/>
      <text x="18" y="15" font-family="'Segoe UI', sans-serif" font-size="15.5" fill="#f1f5f9" font-weight="700">
        Multi-Service Micro-Architecture
      </text>
      <text x="18" y="35" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">
        Decoupled services handling analytics with RabbitMQ messaging.
      </text>

      <!-- Bullet 2 -->
      <circle cx="6" cy="66" r="3.5" fill="#60a5fa"/>
      <text x="18" y="71" font-family="'Segoe UI', sans-serif" font-size="15.5" fill="#f1f5f9" font-weight="700">
        Contextual RAG Conversational AI
      </text>
      <text x="18" y="91" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">
        Integrated LangChain + vector search for sub-second retrieval.
      </text>

      <!-- Bullet 3 -->
      <circle cx="6" cy="122" r="3.5" fill="#38bdf8"/>
      <text x="18" y="127" font-family="'Segoe UI', sans-serif" font-size="15.5" fill="#f1f5f9" font-weight="700">
        High-Throughput Caching &amp; Reliability
      </text>
      <text x="18" y="147" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">
        Redis cache for hot queries with comprehensive test suites.
      </text>
    </g>

    <!-- ═══ LIVE ANIMATED ARCHITECTURE PIPELINE FLOW ═══ -->
    <g transform="translate(20, 328)">
      <rect width="428" height="44" rx="8" fill="#060e1c" stroke="#162b47" stroke-width="1"/>
      <!-- Pipeline Connector Track -->
      <line x1="60" y1="22" x2="370" y2="22" stroke="#1e3a5f" stroke-width="1.8" stroke-dasharray="3,3"/>

      <!-- Animated Data Packets Flowing Left to Right -->
      <circle r="3.5" fill="#38bdf8" filter="url(#projGlow)">
        <animateMotion path="M 60,22 L 370,22" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#67e8f9" filter="url(#projGlow)">
        <animateMotion path="M 60,22 L 370,22" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      </circle>

      <!-- Node 1: Next.js Client -->
      <circle cx="55" cy="22" r="6" fill="#0d2342" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="55" y="38" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="600">CLIENT</text>

      <!-- Node 2: FastAPI / RAG -->
      <circle cx="155" cy="22" r="6" fill="#0d2342" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="155" y="38" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="600">RAG API</text>

      <!-- Node 3: RabbitMQ -->
      <circle cx="260" cy="22" r="6" fill="#0d2342" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="260" y="38" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="600">RABBITMQ</text>

      <!-- Node 4: Postgres / Redis -->
      <circle cx="370" cy="22" r="6" fill="#0d2342" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="370" y="38" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="600">DATABASE</text>
    </g>

    <!-- Bottom Meta (Large 12.5px font) -->
    <g transform="translate(20, 412)">
      <text x="6" y="0" font-family="'Courier New', monospace" font-size="12.5" fill="#60a5fa" font-weight="600">branch: main</text>
      <text x="160" y="0" font-family="'Courier New', monospace" font-size="12.5" fill="#94a3b8" font-weight="600">docker: ready</text>
      <text x="300" y="0" font-family="'Courier New', monospace" font-size="12.5" fill="#34d399" font-weight="600">coverage: 92%</text>
    </g>
  </g>

  <!-- ═════════════════════ PROJECT 2: JOB PORTAL (x:508, y:68) ═════════════════════ -->
  <g transform="translate(508, 68)">
    <!-- Card Container -->
    <rect width="468" height="442" rx="12" fill="url(#projCardBg)"/>
    <rect width="468" height="442" rx="12" fill="url(#projGrid)"/>

    <!-- Border -->
    <rect x="1" y="1" width="466" height="440" rx="11" fill="none" stroke="#2563eb" stroke-width="1.2"/>

    <!-- Top Laser Runner -->
    <line y1="1" y2="1" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" filter="url(#projGlow)">
      <animate attributeName="x1" values="-80;468" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;548" dur="3.4s" repeatCount="indefinite"/>
    </line>

    <!-- Number Pill & Title Area -->
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#0f2847" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="16" y="21.5" font-family="'Segoe UI', sans-serif" font-size="14" fill="#60a5fa" font-weight="800" text-anchor="middle">02</text>

      <text x="44" y="18" font-family="'Segoe UI', sans-serif" font-size="24" fill="#ffffff" font-weight="900" letter-spacing="0.5">Job Portal</text>
      <text x="44" y="42" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8" font-weight="500">Event-Driven Microservices Recruitment Engine</text>

      <!-- Status Indicator Pill -->
      <rect x="298" y="2" width="130" height="24" rx="12" fill="#0f2847" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="310" cy="14" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="320" y="17.5" font-family="'Segoe UI', sans-serif" font-size="11" fill="#34d399" font-weight="800" letter-spacing="0.5">KAFKA CLUSTER</text>
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="78" x2="448" y2="78" stroke="#1e3a5f" stroke-width="1"/>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="82" height="26" rx="5" fill="#0e2340" stroke="#1d4ed8" stroke-width="1"/>
      <text x="41" y="17.5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle" font-weight="700">Spring Boot</text>

      <rect x="88" y="0" width="94" height="26" rx="5" fill="#0e2340" stroke="#1d4ed8" stroke-width="1"/>
      <text x="135" y="17.5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">Apache Kafka</text>

      <rect x="188" y="0" width="88" height="26" rx="5" fill="#0e2340" stroke="#1d4ed8" stroke-width="1"/>
      <text x="232" y="17.5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle" font-weight="700">Spring Cloud</text>

      <rect x="282" y="0" width="56" height="26" rx="5" fill="#0e2340" stroke="#1d4ed8" stroke-width="1"/>
      <text x="310" y="17.5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle" font-weight="700">Docker</text>

      <rect x="344" y="0" width="84" height="26" rx="5" fill="#0e2340" stroke="#1d4ed8" stroke-width="1"/>
      <text x="386" y="17.5" font-family="'Segoe UI', sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">PostgreSQL</text>
    </g>

    <!-- Key Architecture Highlights -->
    <g transform="translate(20, 134)">
      <!-- Bullet 1 -->
      <circle cx="6" cy="10" r="3.5" fill="#60a5fa"/>
      <text x="18" y="15" font-family="'Segoe UI', sans-serif" font-size="15.5" fill="#f1f5f9" font-weight="700">
        Event-Driven Microservices
      </text>
      <text x="18" y="35" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">
        Decoupled Spring Boot services communicating via Kafka topics.
      </text>

      <!-- Bullet 2 -->
      <circle cx="6" cy="66" r="3.5" fill="#38bdf8"/>
      <text x="18" y="71" font-family="'Segoe UI', sans-serif" font-size="15.5" fill="#f1f5f9" font-weight="700">
        Service Discovery &amp; API Gateway
      </text>
      <text x="18" y="91" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">
        Eureka discovery and centralized Spring Cloud API gateway.
      </text>

      <!-- Bullet 3 -->
      <circle cx="6" cy="122" r="3.5" fill="#60a5fa"/>
      <text x="18" y="127" font-family="'Segoe UI', sans-serif" font-size="15.5" fill="#f1f5f9" font-weight="700">
        Distributed Transactions &amp; Auth
      </text>
      <text x="18" y="147" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">
        JWT authentication and resilient asynchronous events.
      </text>
    </g>

    <!-- ═══ LIVE ANIMATED ARCHITECTURE PIPELINE FLOW ═══ -->
    <g transform="translate(20, 328)">
      <rect width="428" height="44" rx="8" fill="#060e1c" stroke="#162b47" stroke-width="1"/>
      <line x1="60" y1="22" x2="370" y2="22" stroke="#1e3a5f" stroke-width="1.8" stroke-dasharray="3,3"/>

      <!-- Animated Data Packets Flowing Left to Right -->
      <circle r="3.5" fill="#60a5fa" filter="url(#projGlow)">
        <animateMotion path="M 60,22 L 370,22" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.5" fill="#93c5fd" filter="url(#projGlow)">
        <animateMotion path="M 60,22 L 370,22" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Node 1: CLIENT -->
      <circle cx="55" cy="22" r="6" fill="#0d2342" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="55" y="38" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="600">CLIENT</text>

      <!-- Node 2: GATEWAY -->
      <circle cx="155" cy="22" r="6" fill="#0d2342" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="155" y="38" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="600">GATEWAY</text>

      <!-- Node 3: KAFKA -->
      <circle cx="260" cy="22" r="6" fill="#0d2342" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="260" y="38" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="600">KAFKA</text>

      <!-- Node 4: SERVICES -->
      <circle cx="370" cy="22" r="6" fill="#0d2342" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="370" y="38" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle" font-weight="600">SERVICES</text>
    </g>

    <!-- Bottom Meta -->
    <g transform="translate(20, 412)">
      <text x="6" y="0" font-family="'Courier New', monospace" font-size="12.5" fill="#60a5fa" font-weight="600">branch: main</text>
      <text x="160" y="0" font-family="'Courier New', monospace" font-size="12.5" fill="#94a3b8" font-weight="600">status: active</text>
      <text x="300" y="0" font-family="'Courier New', monospace" font-size="12.5" fill="#34d399" font-weight="600">kafka: 3-broker</text>
    </g>
  </g>
</svg>
