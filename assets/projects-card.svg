<svg width="1140" height="400" viewBox="0 0 1140 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Section Title Gradient -->
    <linearGradient id="projTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-200 0" to="200 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Flowing Underline Gradient -->
    <linearGradient id="projLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-400 0" to="400 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Top Accent Card Gradient -->
    <linearGradient id="cardTopGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-300 0" to="300 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="cardTopGlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-300 0" to="300 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="projCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a33"/>
      <stop offset="100%" stop-color="#071020"/>
    </linearGradient>

    <pattern id="projGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.4" fill="#60a5fa" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Section Header -->
  <text x="570" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif" font-size="28" font-weight="800" fill="url(#projTitleGrad)" text-anchor="middle" letter-spacing="2">
    FEATURED FLAGSHIP PROJECTS
  </text>
  <rect x="420" y="44" width="300" height="2" fill="url(#projLineGrad)"/>

  <!-- ═════════════════════ PROJECT 1: MSR INSIGHT ═════════════════════ -->
  <g transform="translate(24, 66)">
    <!-- Card Container -->
    <rect width="534" height="318" rx="12" fill="url(#projCardBg)"/>
    <rect width="534" height="318" rx="12" fill="url(#projGrid)"/>

    <!-- Glowing Border -->
    <rect x="1" y="1" width="532" height="316" rx="11" fill="none" stroke="#2563eb" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.4;0.85;0.4" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Top Animated Accent Bar -->
    <rect x="16" y="1" width="502" height="3" rx="1.5" fill="url(#cardTopGlow1)"/>

    <!-- Number Pill & Title Area -->
    <g transform="translate(24, 24)">
      <!-- Number Circle -->
      <circle cx="16" cy="16" r="16" fill="#0f2847" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="16" y="21" font-family="'Segoe UI', sans-serif" font-size="13" fill="#60a5fa" font-weight="bold" text-anchor="middle">01</text>

      <!-- Project Name -->
      <text x="44" y="16" font-family="'Segoe UI', sans-serif" font-size="20" fill="#ffffff" font-weight="800" letter-spacing="0.5">MSR Insight</text>
      <text x="44" y="32" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8" font-weight="500">Analytics &amp; RAG-Powered Conversational Platform</text>

      <!-- Status Indicator Pill -->
      <rect x="360" y="6" width="124" height="22" rx="11" fill="#0f2847" stroke="#1e3a5f" stroke-width="0.8"/>
      <circle cx="374" cy="17" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="384" y="20.5" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#34d399" font-weight="700" letter-spacing="0.5">RAG PIPELINE</text>
    </g>

    <!-- Divider Line -->
    <line x1="24" y1="74" x2="510" y2="74" stroke="#1e3a5f" stroke-width="0.8"/>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(24, 86)">
      <!-- Badge 1: Next.js -->
      <rect x="0" y="0" width="56" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="28" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">Next.js</text>

      <!-- Badge 2: FastAPI -->
      <rect x="62" y="0" width="56" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="90" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">FastAPI</text>

      <!-- Badge 3: Express.js -->
      <rect x="124" y="0" width="72" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="160" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">Express.js</text>

      <!-- Badge 4: LangChain -->
      <rect x="202" y="0" width="74" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="239" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="600">LangChain</text>

      <!-- Badge 5: PostgreSQL -->
      <rect x="282" y="0" width="76" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="320" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">PostgreSQL</text>

      <!-- Badge 6: Redis -->
      <rect x="364" y="0" width="46" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="387" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">Redis</text>

      <!-- Badge 7: RabbitMQ -->
      <rect x="416" y="0" width="68" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="450" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="600">RabbitMQ</text>
    </g>

    <!-- Key Architecture Highlights -->
    <g transform="translate(24, 128)">
      <!-- Bullet 1 -->
      <circle cx="6" cy="10" r="3" fill="#38bdf8"/>
      <text x="18" y="14" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#e2e8f0" font-weight="600">
        Multi-Service Micro-Architecture
      </text>
      <text x="18" y="32" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        Decoupled services handling heavy analytics with RabbitMQ asynchronous queueing.
      </text>

      <!-- Bullet 2 -->
      <circle cx="6" cy="62" r="3" fill="#60a5fa"/>
      <text x="18" y="66" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#e2e8f0" font-weight="600">
        Contextual RAG Conversational AI
      </text>
      <text x="18" y="84" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        Integrated LangChain with vector search for sub-second semantic retrieval &amp; Q&amp;A.
      </text>

      <!-- Bullet 3 -->
      <circle cx="6" cy="114" r="3" fill="#38bdf8"/>
      <text x="18" y="118" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#e2e8f0" font-weight="600">
        High-Throughput Caching &amp; Reliability
      </text>
      <text x="18" y="136" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        Redis layer caching frequent queries + comprehensive Jest unit test automation.
      </text>
    </g>

    <!-- Bottom Footer Meta -->
    <g transform="translate(24, 288)">
      <rect x="0" y="0" width="486" height="20" rx="4" fill="#081326"/>
      <text x="10" y="14" font-family="'Courier New', monospace" font-size="10" fill="#60a5fa">git: main</text>
      <text x="180" y="14" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">docker: ready</text>
      <text x="350" y="14" font-family="'Courier New', monospace" font-size="10" fill="#34d399">coverage: 92%</text>
    </g>
  </g>

  <!-- ═════════════════════ PROJECT 2: JOB PORTAL ═════════════════════ -->
  <g transform="translate(582, 66)">
    <!-- Card Container -->
    <rect width="534" height="318" rx="12" fill="url(#projCardBg)"/>
    <rect width="534" height="318" rx="12" fill="url(#projGrid)"/>

    <!-- Glowing Border -->
    <rect x="1" y="1" width="532" height="316" rx="11" fill="none" stroke="#3b82f6" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.4;0.85;0.4" dur="4.5s" repeatCount="indefinite"/>
    </rect>

