<svg width="1140" height="425" viewBox="0 0 1140 425" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Steady Solid Underline Gradient -->
    <linearGradient id="steadyProjLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="projCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a33"/>
      <stop offset="100%" stop-color="#071020"/>
    </linearGradient>

    <pattern id="projGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.4" fill="#60a5fa" opacity="0.08"/>
    </pattern>

    <filter id="projGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <text x="570" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="2">
    <tspan fill="#60a5fa">FEATURED </tspan><tspan fill="#38bdf8">FLAGSHIP PROJECTS</tspan>
  </text>
  <rect x="420" y="44" width="300" height="2" fill="url(#steadyProjLine)"/>

  <!-- ═════════════════════ PROJECT 1: MSR INSIGHT ═════════════════════ -->
  <g transform="translate(24, 66)">
    <!-- Card Container -->
    <rect width="534" height="344" rx="12" fill="url(#projCardBg)"/>
    <rect width="534" height="344" rx="12" fill="url(#projGrid)"/>

    <!-- Border -->
    <rect x="1" y="1" width="532" height="342" rx="11" fill="none" stroke="#1d4ed8" stroke-width="1.2"/>

    <!-- Top Laser Runner (Real Physical Beam) -->
    <line y1="1" y2="1" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#projGlow)">
      <animate attributeName="x1" values="-100;540" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;640" dur="3s" repeatCount="indefinite"/>
    </line>

    <!-- Number Pill & Title Area -->
    <g transform="translate(24, 24)">
      <circle cx="16" cy="16" r="16" fill="#0f2847" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="16" y="21" font-family="'Segoe UI', sans-serif" font-size="13" fill="#60a5fa" font-weight="bold" text-anchor="middle">01</text>

      <text x="44" y="16" font-family="'Segoe UI', sans-serif" font-size="20" fill="#ffffff" font-weight="800" letter-spacing="0.5">MSR Insight</text>
      <text x="44" y="32" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8" font-weight="500">Analytics &amp; RAG-Powered Conversational Platform</text>

      <!-- Status Indicator Pill -->
      <rect x="360" y="6" width="124" height="22" rx="11" fill="#0f2847" stroke="#1e3a5f" stroke-width="0.8"/>
      <circle cx="374" cy="17" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="384" y="20.5" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#34d399" font-weight="700" letter-spacing="0.5">RAG PIPELINE</text>
    </g>

    <!-- Divider Line -->
    <line x1="24" y1="74" x2="510" y2="74" stroke="#1e3a5f" stroke-width="0.8"/>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(24, 86)">
      <rect x="0" y="0" width="56" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="28" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">Next.js</text>

      <rect x="62" y="0" width="56" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="90" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">FastAPI</text>

      <rect x="124" y="0" width="72" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="160" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">Express.js</text>

      <rect x="202" y="0" width="74" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="239" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="600">LangChain</text>

      <rect x="282" y="0" width="76" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="320" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">PostgreSQL</text>

      <rect x="364" y="0" width="46" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="387" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">Redis</text>

      <rect x="416" y="0" width="68" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="450" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="600">RabbitMQ</text>
    </g>

    <!-- Key Architecture Highlights -->
    <g transform="translate(24, 126)">
      <circle cx="6" cy="10" r="3" fill="#38bdf8"/>
      <text x="18" y="14" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">
        Multi-Service Micro-Architecture
      </text>
      <text x="18" y="30" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        Decoupled services handling analytics with RabbitMQ asynchronous queueing.
      </text>

      <circle cx="6" cy="56" r="3" fill="#60a5fa"/>
      <text x="18" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">
        Contextual RAG Conversational AI
      </text>
      <text x="18" y="76" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        Integrated LangChain with vector search for sub-second semantic retrieval &amp; Q&amp;A.
      </text>

      <circle cx="6" cy="102" r="3" fill="#38bdf8"/>
      <text x="18" y="106" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">
        High-Throughput Caching &amp; Reliability
      </text>
      <text x="18" y="122" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        Redis cache layer for frequent queries + comprehensive Jest test suites.
      </text>
    </g>

    <!-- ═══ LIVE ANIMATED ARCHITECTURE PIPELINE FLOW ═══ -->
    <g transform="translate(24, 276)">
      <rect width="486" height="34" rx="6" fill="#060e1c" stroke="#162b47" stroke-width="0.8"/>
      <!-- Pipeline Connector Track -->
      <line x1="80" y1="17" x2="430" y2="17" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- Animated Data Packets Flowing Left to Right -->
      <circle r="3" fill="#38bdf8" filter="url(#projGlow)">
        <animateMotion path="M 80,17 L 430,17" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.2" fill="#67e8f9" filter="url(#projGlow)">
        <animateMotion path="M 80,17 L 430,17" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      </circle>

      <!-- Node 1: Next.js Client -->
      <circle cx="70" cy="17" r="5" fill="#0d2342" stroke="#38bdf8" stroke-width="1"/>
      <text x="70" y="30" font-family="'Courier New', monospace" font-size="7.5" fill="#94a3b8" text-anchor="middle">CLIENT</text>

      <!-- Node 2: FastAPI / RAG -->
      <circle cx="180" cy="17" r="5" fill="#0d2342" stroke="#38bdf8" stroke-width="1"/>
      <text x="180" y="30" font-family="'Courier New', monospace" font-size="7.5" fill="#94a3b8" text-anchor="middle">RAG API</text>

      <!-- Node 3: RabbitMQ -->
      <circle cx="295" cy="17" r="5" fill="#0d2342" stroke="#38bdf8" stroke-width="1"/>
      <text x="295" y="30" font-family="'Courier New', monospace" font-size="7.5" fill="#94a3b8" text-anchor="middle">RABBITMQ</text>

      <!-- Node 4: Postgres / Redis -->
      <circle cx="420" cy="17" r="5" fill="#0d2342" stroke="#38bdf8" stroke-width="1"/>
      <text x="420" y="30" font-family="'Courier New', monospace" font-size="7.5" fill="#94a3b8" text-anchor="middle">DATA STORE</text>
    </g>

    <!-- Bottom Meta -->
    <g transform="translate(24, 318)">
      <text x="6" y="14" font-family="'Courier New', monospace" font-size="9.5" fill="#60a5fa">branch: main</text>
      <text x="190" y="14" font-family="'Courier New', monospace" font-size="9.5" fill="#94a3b8">docker: ready</text>
      <text x="360" y="14" font-family="'Courier New', monospace" font-size="9.5" fill="#34d399">coverage: 92%</text>
    </g>
  </g>

  <!-- ═════════════════════ PROJECT 2: JOB PORTAL ═════════════════════ -->
  <g transform="translate(582, 66)">
    <!-- Card Container -->
    <rect width="534" height="344" rx="12" fill="url(#projCardBg)"/>
    <rect width="534" height="344" rx="12" fill="url(#projGrid)"/>

    <!-- Border -->
    <rect x="1" y="1" width="532" height="342" rx="11" fill="none" stroke="#2563eb" stroke-width="1.2"/>

    <!-- Top Laser Runner (Real Physical Beam) -->
    <line y1="1" y2="1" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" filter="url(#projGlow)">
      <animate attributeName="x1" values="-100;540" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;640" dur="3.4s" repeatCount="indefinite"/>
    </line>

    <!-- Number Pill & Title Area -->
    <g transform="translate(24, 24)">
      <circle cx="16" cy="16" r="16" fill="#0f2847" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="16" y="21" font-family="'Segoe UI', sans-serif" font-size="13" fill="#60a5fa" font-weight="bold" text-anchor="middle">02</text>

      <text x="44" y="16" font-family="'Segoe UI', sans-serif" font-size="20" fill="#ffffff" font-weight="800" letter-spacing="0.5">Job Portal</text>
      <text x="44" y="32" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8" font-weight="500">Event-Driven Microservices Recruitment Engine</text>

      <!-- Status Indicator Pill -->
      <rect x="360" y="6" width="124" height="22" rx="11" fill="#0f2847" stroke="#1e3a5f" stroke-width="0.8"/>
      <circle cx="374" cy="17" r="3.5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="384" y="20.5" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#34d399" font-weight="700" letter-spacing="0.5">KAFKA CLUSTER</text>
    </g>

    <!-- Divider Line -->
    <line x1="24" y1="74" x2="510" y2="74" stroke="#1e3a5f" stroke-width="0.8"/>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(24, 86)">
      <rect x="0" y="0" width="76" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="38" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">Spring Boot</text>

      <rect x="82" y="0" width="88" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="126" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="600">Apache Kafka</text>

      <rect x="176" y="0" width="82" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="217" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">Spring Cloud</text>

      <rect x="264" y="0" width="44" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="286" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">Redis</text>

      <rect x="314" y="0" width="52" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="340" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="600">Docker</text>

      <rect x="372" y="0" width="50" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="397" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">MySQL</text>

      <rect x="428" y="0" width="54" height="22" rx="4" fill="#0e2340" stroke="#1d4ed8" stroke-width="0.8"/>
      <text x="455" y="15" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="600">Next.js</text>
    </g>

    <!-- Key Architecture Highlights -->
    <g transform="translate(24, 126)">
      <circle cx="6" cy="10" r="3" fill="#60a5fa"/>
      <text x="18" y="14" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">
        Event-Driven Asynchronous Pipelines
      </text>
      <text x="18" y="30" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        Apache Kafka event streams powering real-time applicant alerts &amp; notifications.
      </text>

      <circle cx="6" cy="56" r="3" fill="#38bdf8"/>
      <text x="18" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">
        Cloud-Native Service Mesh &amp; Gateway
      </text>
      <text x="18" y="76" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        Spring Cloud discovery, centralized API gateway routing, and JWT auth security.
      </text>

      <circle cx="6" cy="102" r="3" fill="#60a5fa"/>
      <text x="18" y="106" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">
        AI-Powered Candidate Assessment
      </text>
      <text x="18" y="122" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
        Spring AI integration for smart resume evaluation &amp; automated job matching.
      </text>
    </g>

    <!-- ═══ LIVE ANIMATED ARCHITECTURE PIPELINE FLOW ═══ -->
    <g transform="translate(24, 276)">
      <rect width="486" height="34" rx="6" fill="#060e1c" stroke="#162b47" stroke-width="0.8"/>
      <line x1="80" y1="17" x2="430" y2="17" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- Animated Event Packets Flowing Left to Right -->
      <circle r="3" fill="#67e8f9" filter="url(#projGlow)">
        <animateMotion path="M 80,17 L 430,17" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.2" fill="#38bdf8" filter="url(#projGlow)">
        <animateMotion path="M 80,17 L 430,17" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Node 1: Client -->
      <circle cx="70" cy="17" r="5" fill="#0d2342" stroke="#60a5fa" stroke-width="1"/>
      <text x="70" y="30" font-family="'Courier New', monospace" font-size="7.5" fill="#94a3b8" text-anchor="middle">CLIENT</text>

      <!-- Node 2: Spring Gateway -->
      <circle cx="180" cy="17" r="5" fill="#0d2342" stroke="#60a5fa" stroke-width="1"/>
      <text x="180" y="30" font-family="'Courier New', monospace" font-size="7.5" fill="#94a3b8" text-anchor="middle">GATEWAY</text>

      <!-- Node 3: Kafka Bus -->
      <circle cx="295" cy="17" r="5" fill="#0d2342" stroke="#67e8f9" stroke-width="1.2"/>
      <text x="295" y="30" font-family="'Courier New', monospace" font-size="7.5" fill="#38bdf8" text-anchor="middle">KAFKA BUS</text>

      <!-- Node 4: Microservice Cluster -->
      <circle cx="420" cy="17" r="5" fill="#0d2342" stroke="#60a5fa" stroke-width="1"/>
      <text x="420" y="30" font-family="'Courier New', monospace" font-size="7.5" fill="#94a3b8" text-anchor="middle">SERVICES</text>
    </g>

    <!-- Bottom Meta -->
    <g transform="translate(24, 318)">
      <text x="6" y="14" font-family="'Courier New', monospace" font-size="9.5" fill="#60a5fa">branch: main</text>
      <text x="190" y="14" font-family="'Courier New', monospace" font-size="9.5" fill="#94a3b8">kafka: partitioned</text>
      <text x="350" y="14" font-family="'Courier New', monospace" font-size="9.5" fill="#34d399">cluster: healthy</text>
    </g>
  </g>
</svg>
