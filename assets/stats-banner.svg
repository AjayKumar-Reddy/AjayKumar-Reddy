<svg width="1000" height="100" viewBox="0 0 1000 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Steady Solid Underline Gradient -->
    <linearGradient id="steadyStatsLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <filter id="statsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Telemetry Equalizer Bars (Real Motion) -->
  <g fill="#38bdf8" opacity="0.9">
    <rect x="150" width="3.5" rx="1.5">
      <animate attributeName="y" values="40;24;36;28;40" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="14;30;18;26;14" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="160" width="3.5" rx="1.5">
      <animate attributeName="y" values="36;20;32;22;36" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="height" values="18;34;22;32;18" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="170" width="3.5" rx="1.5">
      <animate attributeName="y" values="44;26;40;30;44" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="10;28;14;24;10" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="180" width="3.5" rx="1.5">
      <animate attributeName="y" values="32;18;34;24;32" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="22;36;20;30;22" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="190" width="3.5" rx="1.5">
      <animate attributeName="y" values="40;28;42;32;40" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="height" values="14;26;12;22;14" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Title (Large 32px Font) -->
  <text x="500" y="48" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="2.5">
    <tspan fill="#60a5fa">GITHUB </tspan><tspan fill="#38bdf8">TELEMETRY &amp; ANALYTICS</tspan>
  </text>

  <!-- Right Telemetry Equalizer Bars (Real Motion) -->
  <g fill="#38bdf8" opacity="0.9">
    <rect x="806" width="3.5" rx="1.5">
      <animate attributeName="y" values="40;28;42;32;40" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="height" values="14;26;12;22;14" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="816" width="3.5" rx="1.5">
      <animate attributeName="y" values="32;18;34;24;32" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="22;36;20;30;22" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="826" width="3.5" rx="1.5">
      <animate attributeName="y" values="44;26;40;30;44" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="10;28;14;24;10" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="836" width="3.5" rx="1.5">
      <animate attributeName="y" values="36;20;32;22;36" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="height" values="18;34;22;32;18" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="846" width="3.5" rx="1.5">
      <animate attributeName="y" values="40;24;36;28;40" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="14;30;18;26;14" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Underline Track -->
  <rect x="240" y="68" width="520" height="2" fill="url(#steadyStatsLine)"/>

  <!-- Traveling Laser Beam along Underline (Real Motion) -->
  <line y1="69" y2="69" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" filter="url(#statsGlow)">
    <animate attributeName="x1" values="240;680;240" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="320;760;320" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
