<svg width="1200" height="90" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Steady Solid Underline Gradient -->
    <linearGradient id="steadyStatsLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <filter id="statsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Telemetry Equalizer Bars (Real Motion) -->
  <g fill="#38bdf8" opacity="0.85">
    <rect x="250" width="3" rx="1.5">
      <animate attributeName="y" values="36;22;32;26;36" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;26;16;22;12" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="258" width="3" rx="1.5">
      <animate attributeName="y" values="32;18;28;20;32" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="height" values="16;30;20;28;16" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="266" width="3" rx="1.5">
      <animate attributeName="y" values="40;24;36;28;40" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="8;24;12;20;8" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="274" width="3" rx="1.5">
      <animate attributeName="y" values="28;16;30;22;28" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="20;32;18;26;20" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="282" width="3" rx="1.5">
      <animate attributeName="y" values="36;26;38;30;36" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;22;10;18;12" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="600" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="2.5">
    <tspan fill="#60a5fa">GITHUB </tspan><tspan fill="#38bdf8">TELEMETRY &amp; ANALYTICS</tspan>
  </text>

  <!-- Right Telemetry Equalizer Bars (Real Motion) -->
  <g fill="#38bdf8" opacity="0.85">
    <rect x="918" width="3" rx="1.5">
      <animate attributeName="y" values="36;26;38;30;36" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;22;10;18;12" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="926" width="3" rx="1.5">
      <animate attributeName="y" values="28;16;30;22;28" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="20;32;18;26;20" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="934" width="3" rx="1.5">
      <animate attributeName="y" values="40;24;36;28;40" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="8;24;12;20;8" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="942" width="3" rx="1.5">
      <animate attributeName="y" values="32;18;28;20;32" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="height" values="16;30;20;28;16" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="950" width="3" rx="1.5">
      <animate attributeName="y" values="36;22;32;26;36" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;26;16;22;12" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Underline Track -->
  <rect x="320" y="62" width="560" height="2" fill="url(#steadyStatsLine)"/>

  <!-- Traveling Laser Beam along Underline (Real Motion) -->
  <line y1="63" y2="63" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" filter="url(#statsGlow)">
    <animate attributeName="x1" values="320;800;320" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="400;880;400" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
