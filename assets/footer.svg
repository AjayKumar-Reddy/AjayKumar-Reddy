<svg width="1000" height="110" viewBox="0 0 1000 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Steady Solid Divider Line Gradient -->
    <linearGradient id="steadyFooterLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#1d4ed8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#1d4ed8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- Capsule Border Gradient -->
    <linearGradient id="capsuleBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="footerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Capsule Container for Flawless Contrast across GitHub Themes -->
  <rect x="60" y="8" width="880" height="94" rx="14" fill="#081426" stroke="url(#capsuleBorder)" stroke-width="1.2"/>

  <!-- Divider Line Track -->
  <rect x="100" y="20" width="800" height="2" fill="url(#steadyFooterLine)"/>

  <!-- Traveling Laser Runner along Divider (Real Motion) -->
  <line y1="21" y2="21" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" filter="url(#footerGlow)">
    <animate attributeName="x1" values="100;780;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="220;900;220" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Center Glowing Node on Line -->
  <circle cx="500" cy="21" r="3.5" fill="#60a5fa">
    <animate attributeName="r" values="2.5;4.5;2.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Flanking Accent Nodes -->
  <circle cx="260" cy="21" r="2.5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="740" cy="21" r="2.5" fill="#3b82f6" opacity="0.6"/>

  <!-- Terminal Icon / Code Chevron with Orbiting Satellite Electron -->
  <g transform="translate(500, 44)">
    <circle cx="0" cy="0" r="11" fill="#0d1f3c" stroke="#1e3a5f" stroke-width="1"/>
    <text x="0" y="4" font-family="'Courier New', monospace" font-size="11" fill="#60a5fa" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
    <!-- Orbiting Satellite Electron (Real Motion) -->
    <circle cx="17" cy="0" r="2.2" fill="#38bdf8" filter="url(#footerGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Attribution Signature (Steady, High-Contrast, Large 14px Font) -->
  <text x="500" y="72" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" fill="#94a3b8" text-anchor="middle" letter-spacing="3" font-weight="700">
    DESIGNED &amp; ENGINEERED BY <tspan fill="#38bdf8" font-weight="900">AJAY KUMAR S</tspan>
  </text>

  <!-- Subtitle Tagline (Large 12px Font) -->
  <text x="500" y="90" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="2" font-weight="600">
    SCALABLE SYSTEMS  •  CLEAN ARCHITECTURE  •  CONTINUOUS INNOVATION
  </text>
</svg>
