<svg width="1000" height="90" viewBox="0 0 1000 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Steady Solid Divider Line Gradient -->
    <linearGradient id="steadyFooterLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#1d4ed8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#1d4ed8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- Capsule Border Gradient -->
    <linearGradient id="capsuleBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="footerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Capsule Container for Flawless Contrast across GitHub Themes -->
  <rect x="80" y="6" width="840" height="78" rx="14" fill="#081426" stroke="url(#capsuleBorder)" stroke-width="1"/>

  <!-- Divider Line Track -->
  <rect x="120" y="16" width="760" height="2" fill="url(#steadyFooterLine)"/>

  <!-- Traveling Laser Runner along Divider (Real Motion) -->
  <line y1="17" y2="17" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" filter="url(#footerGlow)">
    <animate attributeName="x1" values="120;800;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="220;900;220" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Center Glowing Node on Line -->
  <circle cx="500" cy="17" r="3" fill="#60a5fa">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Flanking Accent Nodes -->
  <circle cx="280" cy="17" r="2" fill="#3b82f6" opacity="0.6"/>
  <circle cx="720" cy="17" r="2" fill="#3b82f6" opacity="0.6"/>

  <!-- Terminal Icon / Code Chevron with Orbiting Satellite Electron -->
  <g transform="translate(500, 36)">
    <circle cx="0" cy="0" r="9" fill="#0d1f3c" stroke="#1e3a5f" stroke-width="0.8"/>
    <text x="0" y="3.5" font-family="'Courier New', monospace" font-size="9.5" fill="#60a5fa" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
    <!-- Orbiting Satellite Electron (Real Motion) -->
    <circle cx="15" cy="0" r="2" fill="#38bdf8" filter="url(#footerGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Attribution Signature (Steady, High-Contrast) -->
  <text x="500" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle" letter-spacing="3" font-weight="600">
    DESIGNED &amp; ENGINEERED BY <tspan fill="#38bdf8" font-weight="800">AJAY KUMAR S</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="500" y="74" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#64748b" text-anchor="middle" letter-spacing="2.5">
    SCALABLE SYSTEMS  •  CLEAN ARCHITECTURE  •  CONTINUOUS INNOVATION
  </text>
</svg>
