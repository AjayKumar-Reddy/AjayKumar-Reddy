<svg width="800" height="60" viewBox="0 0 800 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="60" fill="transparent"/>

  <!-- Gradient divider line -->
  <rect x="100" y="6" width="600" height="1" fill="url(#footerLine)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Attribution -->
  <text x="400" y="30" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="2">DESIGNED &amp; ENGINEERED BY <tspan fill="#94a3b8" font-weight="bold">AJAY KUMAR</tspan></text>

  <!-- Status indicator -->
  <circle cx="348" cy="47" r="3" fill="#22c55e" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="408" y="50" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle" letter-spacing="2.5">OPEN TO OPPORTUNITIES</text>
</svg>
