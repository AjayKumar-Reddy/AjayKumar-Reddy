<svg width="1000" height="90" viewBox="0 0 1000 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated Flowing Divider Line -->
    <linearGradient id="footerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#1d4ed8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-500 0" to="500 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Shimmering Signature Text Gradient -->
    <linearGradient id="footerTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-200 0" to="200 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Capsule Border Gradient -->
    <linearGradient id="capsuleBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Capsule Container for Flawless Contrast in Both Dark and Light GitHub Themes -->
  <rect x="80" y="6" width="840" height="78" rx="14" fill="#081426" stroke="url(#capsuleBorder)" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Flowing Gradient Divider Line -->
  <rect x="120" y="16" width="760" height="2" fill="url(#footerLineGrad)"/>

  <!-- Center Glowing Pulse on Line -->
  <circle cx="500" cy="17" r="3" fill="#60a5fa">
    <animate attributeName="r" values="2;4.5;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Flanking Accent Nodes -->
  <circle cx="280" cy="17" r="2" fill="#3b82f6" opacity="0.5"/>
  <circle cx="720" cy="17" r="2" fill="#3b82f6" opacity="0.5"/>

  <!-- Terminal Icon / Code Chevron -->
  <g transform="translate(500, 36)">
    <circle cx="0" cy="0" r="9" fill="#0d1f3c" stroke="#1e3a5f" stroke-width="0.8"/>
    <text x="0" y="3.5" font-family="'Courier New', monospace" font-size="9.5" fill="#60a5fa" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Attribution Signature (NO "Open to Opportunities") -->
  <text x="500" y="58" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle" letter-spacing="3" font-weight="600">
    DESIGNED &amp; ENGINEERED BY <tspan fill="url(#footerTextGrad)" font-weight="800">AJAY KUMAR S</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="500" y="74" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#64748b" text-anchor="middle" letter-spacing="2.5">
    SCALABLE SYSTEMS  •  CLEAN ARCHITECTURE  •  CONTINUOUS INNOVATION
  </text>
</svg>
