<svg width="360" height="96" viewBox="0 0 360 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a33"/>
      <stop offset="100%" stop-color="#071020"/>
    </linearGradient>
    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="360" height="96" rx="12" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="358" height="94" rx="11" fill="none" stroke="#1d4ed8" stroke-width="1.2"/>

  <!-- Top Laser Runner (Real Motion) -->
  <line y1="1" y2="1" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#btnGlow)">
    <animate attributeName="x1" values="-60;360" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;420" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Mail Icon Circle -->
  <g transform="translate(30, 48)">
    <circle cx="0" cy="0" r="22" fill="#0f2847" stroke="#3b82f6" stroke-width="1"/>
    <!-- Email Envelope -->
    <rect x="-11" y="-8" width="22" height="16" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <path d="M-10 -7 L0 1 L10 -7" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  </g>

  <!-- Text Area -->
  <text x="68" y="40" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10.5" fill="#38bdf8" font-weight="700" letter-spacing="2">
    DIRECT EMAIL
  </text>
  <text x="68" y="60" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" fill="#f1f5f9" font-weight="600">
    akumar23755@gmail.com
  </text>

  <!-- Right Status Indicator & Arrow -->
  <g transform="translate(322, 48)">
    <circle cx="-16" cy="0" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Arrow with horizontal bounce -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 4 0; 0 0" dur="1.5s" repeatCount="indefinite"/>
      <path d="M-2 -5 L3 0 L-2 5" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
