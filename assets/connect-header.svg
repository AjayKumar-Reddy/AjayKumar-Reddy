<svg width="1000" height="100" viewBox="0 0 1000 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Steady Solid Underline Gradient -->
    <linearGradient id="steadyConnectLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <filter id="connectGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Broadcasting Radio Waves (Real Motion) -->
  <g transform="translate(230, 44)">
    <circle cx="0" cy="0" r="4.5" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#38bdf8" stroke-width="1.4">
      <animate attributeName="r" values="4;24" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#60a5fa" stroke-width="1.4">
      <animate attributeName="r" values="4;24" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title (Large 32px Font) -->
  <text x="500" y="48" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="2.5">
    <tspan fill="#60a5fa">CONNECT &amp; </tspan><tspan fill="#38bdf8">COLLABORATE</tspan>
  </text>

  <!-- Right Broadcasting Radio Waves (Real Motion) -->
  <g transform="translate(770, 44)">
    <circle cx="0" cy="0" r="4.5" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#38bdf8" stroke-width="1.4">
      <animate attributeName="r" values="4;24" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#60a5fa" stroke-width="1.4">
      <animate attributeName="r" values="4;24" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Underline Track -->
  <rect x="280" y="68" width="440" height="2" fill="url(#steadyConnectLine)"/>

  <!-- Traveling Laser Beam along Underline (Real Motion) -->
  <line y1="69" y2="69" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" filter="url(#connectGlow)">
    <animate attributeName="x1" values="280;640;280" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="360;720;360" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
