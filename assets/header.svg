<svg width="1000" height="470" viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b17"/>
      <stop offset="50%" stop-color="#081326"/>
      <stop offset="100%" stop-color="#0c1d38"/>
    </linearGradient>

    <linearGradient id="steadyLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#1e40af" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#040b17" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#040b17" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="0.8" fill="#60a5fa" opacity="0.12"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1000" height="470" fill="url(#bgGrad)"/>
  <rect width="1000" height="470" fill="url(#dotGrid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="160" cy="150" r="260" fill="url(#orbGlow1)">
    <animate attributeName="r" values="230;270;230" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="840" cy="300" r="240" fill="url(#orbGlow2)">
    <animate attributeName="r" values="210;250;210" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Cyber Dust Particles (Real Physical Motion) -->
  <g fill="#38bdf8">
    <circle cx="120" cy="300" r="1.8" opacity="0.3">
      <animate attributeName="cy" values="360;80;360" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="180" r="2" opacity="0.4">
      <animate attributeName="cy" values="300;60;300" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="120" r="1.8" opacity="0.4">
      <animate attributeName="cy" values="160;380;160" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="240" r="2.2" opacity="0.5">
      <animate attributeName="cy" values="340;70;340" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left Side Constellation Network -->
  <g opacity="0.25" stroke="#3b82f6" stroke-width="1" fill="none">
    <line x1="50" y1="90" x2="130" y2="160"/>
    <line x1="130" y1="160" x2="210" y2="70"/>
    <line x1="210" y1="70" x2="270" y2="140"/>
    <line x1="130" y1="160" x2="100" y2="320"/>
    <line x1="100" y1="320" x2="210" y2="380"/>
  </g>

  <!-- Moving Data Packets -->
  <circle r="3.5" fill="#38bdf8" filter="url(#glow)">
    <animateMotion path="M 50,90 L 130,160 L 210,70 L 270,140 L 210,380" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Nodes -->
  <g fill="#60a5fa">
    <circle cx="50" cy="90" r="3" opacity="0.6"/>
    <circle cx="130" cy="160" r="4" opacity="0.8">
      <animate attributeName="r" values="3.5;6;3.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="70" r="3" opacity="0.6"/>
    <circle cx="270" cy="140" r="3.5" opacity="0.7"/>
    <circle cx="100" cy="320" r="3.5" opacity="0.6"/>
    <circle cx="210" cy="380" r="3.5" opacity="0.7"/>
  </g>

  <!-- Right Side Constellation Network -->
  <g opacity="0.25" stroke="#60a5fa" stroke-width="1" fill="none">
    <line x1="730" y1="110" x2="810" y2="190"/>
    <line x1="810" y1="190" x2="890" y2="90"/>
    <line x1="890" y1="90" x2="950" y2="170"/>
    <line x1="950" y1="170" x2="870" y2="290"/>
    <line x1="870" y1="290" x2="770" y2="350"/>
  </g>

  <circle r="3.5" fill="#38bdf8" filter="url(#glow)">
    <animateMotion path="M 730,110 L 810,190 L 890,90 L 950,170 L 870,290" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Right Nodes -->
  <g fill="#93c5fd">
    <circle cx="730" cy="110" r="3" opacity="0.6"/>
    <circle cx="810" cy="190" r="3.5" opacity="0.6"/>
    <circle cx="890" cy="90" r="3" opacity="0.6"/>
    <circle cx="950" cy="170" r="4" opacity="0.8">
      <animate attributeName="r" values="3.5;6;3.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="290" r="3.5" opacity="0.7"/>
    <circle cx="770" cy="350" r="3" opacity="0.6"/>
  </g>

  <!-- Floating HUD Corner Brackets -->
  <g opacity="0.4" stroke="#3b82f6" stroke-width="1.5" fill="none">
    <path d="M 25,45 L 25,25 L 45,25"/>
    <circle cx="25" cy="25" r="2.5" fill="#3b82f6"/>
    <path d="M 25,425 L 25,445 L 45,445"/>
    <circle cx="25" cy="445" r="2.5" fill="#3b82f6"/>
    <path d="M 975,45 L 975,25 L 955,25"/>
    <circle cx="975" cy="25" r="2.5" fill="#3b82f6"/>
    <path d="M 975,425 L 975,445 L 955,445"/>
    <circle cx="975" cy="445" r="2.5" fill="#3b82f6"/>
  </g>

  <!-- Center Decorative Flanking Lines -->
  <g opacity="0.4">
    <line x1="210" y1="120" x2="310" y2="120" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="310" cy="120" r="2.5" fill="#60a5fa"/>
    <line x1="690" y1="120" x2="790" y2="120" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="690" cy="120" r="2.5" fill="#60a5fa"/>
  </g>

  <!-- Role Badge: SOFTWARE ENGINEER (Large, High-Contrast) -->
  <g transform="translate(500, 120)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#0f2847" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    <circle cx="-134" cy="0" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="-120" y="5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#93c5fd" letter-spacing="4" font-weight="800">SOFTWARE ENGINEER</text>
  </g>

  <!-- Main Name: AJAY KUMAR S (Extra Large & Bold for Instant Mobile Legibility) -->
  <text x="500" y="222" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="82" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="1.5">
    AJAY <tspan fill="#38bdf8">KUMAR S</tspan>
  </text>

  <!-- Core Engineering Tags (Large 17.5px font size) -->
  <text x="500" y="278" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17.5" fill="#cbd5e1" text-anchor="middle" font-weight="600" letter-spacing="0.8">
    Information Science &amp; Eng  <tspan fill="#38bdf8">●</tspan>  Full Stack &amp; Distributed Systems  <tspan fill="#38bdf8">●</tspan>  Cloud Native &amp; Microservices  <tspan fill="#38bdf8">●</tspan>  AI &amp; Cloud
  </text>

  <!-- Email & Quick Meta Bar (Large 15px font size) -->
  <g transform="translate(500, 328)">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#0a1628" stroke="#1e3a5f" stroke-width="1.2" opacity="0.9"/>
    <g transform="translate(-155, -8)">
      <rect x="0" y="2" width="16" height="11" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
      <path d="M0.5 2.5 L8 8.5 L15.5 2.5" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
    </g>
    <text x="5" y="5" font-family="'Segoe UI', -apple-system, monospace" font-size="15" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">akumar23755@gmail.com</text>
  </g>

  <!-- Interactive Terminal Prompt Simulation (Large 16px font size) -->
  <g transform="translate(500, 390)">
    <text x="0" y="0" font-family="'Courier New', 'Consolas', monospace" font-size="16.5" fill="#60a5fa" text-anchor="middle" font-weight="600">
      &gt; git commit -m "feat: scale distributed architectures &amp; AI workflows"
      <tspan fill="#38bdf8">
        _
        <animate attributeName="opacity" values="0;1;0" dur="0.9s" repeatCount="indefinite"/>
      </tspan>
    </text>
  </g>

  <!-- Traveling Laser Beam along Bottom Border -->
  <rect x="0" y="464" width="1000" height="3" fill="url(#steadyLine)"/>
  <line y1="465" y2="465" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="x1" values="-180;1000" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1180" dur="3.5s" repeatCount="indefinite"/>
  </line>
</svg>
