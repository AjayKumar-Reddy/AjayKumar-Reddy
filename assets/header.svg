<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f1d32"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="#3b82f6" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#dotGrid)"/>

  <!-- Ambient glow orbs -->
  <circle cx="180" cy="120" r="220" fill="url(#orbGlow1)"/>
  <circle cx="1020" cy="280" r="200" fill="url(#orbGlow2)"/>

  <!-- Constellation — Left cluster -->
  <g opacity="0.15" stroke="#3b82f6" stroke-width="0.6" fill="none">
    <line x1="80" y1="70" x2="160" y2="140"/>
    <line x1="160" y1="140" x2="240" y2="55"/>
    <line x1="240" y1="55" x2="330" y2="110"/>
    <line x1="160" y1="140" x2="130" y2="270"/>
    <line x1="130" y1="270" x2="260" y2="320"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="80" cy="70" r="1.8" opacity="0.25"/>
    <circle cx="160" cy="140" r="2.2" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="55" r="1.5" opacity="0.2"/>
    <circle cx="330" cy="110" r="1.8" opacity="0.25"/>
    <circle cx="130" cy="270" r="1.5" opacity="0.2"/>
    <circle cx="260" cy="320" r="1.8" opacity="0.2"/>
  </g>

  <!-- Constellation — Right cluster -->
  <g opacity="0.15" stroke="#60a5fa" stroke-width="0.6" fill="none">
    <line x1="870" y1="90" x2="960" y2="170"/>
    <line x1="960" y1="170" x2="1060" y2="75"/>
    <line x1="1060" y1="75" x2="1110" y2="155"/>
    <line x1="1110" y1="155" x2="1010" y2="245"/>
    <line x1="1010" y1="245" x2="910" y2="295"/>
    <line x1="910" y1="295" x2="870" y2="90"/>
    <line x1="910" y1="295" x2="800" y2="340"/>
  </g>
  <g fill="#60a5fa">
    <circle cx="870" cy="90" r="1.8" opacity="0.25"/>
    <circle cx="960" cy="170" r="1.8" opacity="0.25"/>
    <circle cx="1060" cy="75" r="1.5" opacity="0.2"/>
    <circle cx="1110" cy="155" r="2.2" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="245" r="1.8" opacity="0.25"/>
    <circle cx="910" cy="295" r="1.5" opacity="0.2"/>
    <circle cx="800" cy="340" r="1.8" opacity="0.2"/>
  </g>

  <!-- Decorative lines flanking subtitle -->
  <line x1="320" y1="127" x2="425" y2="127" stroke="#3b82f6" stroke-width="0.8" opacity="0.2"/>
  <line x1="775" y1="127" x2="880" y2="127" stroke="#3b82f6" stroke-width="0.8" opacity="0.2"/>

  <!-- Label: ASPIRING SOFTWARE ENGINEER -->
  <text x="600" y="131" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#60a5fa" text-anchor="middle" letter-spacing="6" font-weight="600">ASPIRING SOFTWARE ENGINEER</text>

  <!-- Name: AJAY KUMAR S -->
  <text x="600" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="bold" text-anchor="middle" fill="#ffffff">AJAY <tspan fill="#3b82f6">KUMAR S</tspan></text>

  <!-- Tags -->
  <text x="600" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" font-style="italic">Information Science Student  |  Full Stack Developer  |  DSA in Java  |  Exploring AI  |  Open to Opportunities</text>

  <!-- Email -->
  <g transform="translate(508, 285)">
    <rect x="0" y="2" width="14" height="10" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <path d="M0.5 2.5 L7 8 L13.5 2.5" fill="none" stroke="#94a3b8" stroke-width="1"/>
  </g>
  <text x="612" y="296" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">akumar23755@gmail.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="390" width="1200" height="3" fill="url(#accentLine)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="391" r="4" fill="#3b82f6" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
